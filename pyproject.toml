[project]
name = "nifty-option-research"
version = "0.1.0"
description = "A LangGraph agent that continuously researches optimised option-selling strategies for the NIFTY index."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
nifty-research = "nifty_research.graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nifty_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
